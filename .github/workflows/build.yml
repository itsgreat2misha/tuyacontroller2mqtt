name: Build APK

# Builds the daemon APK with the manual build.sh (no Gradle).
# - On every push to main and every pull request: run the unit tests
#   and a debug-signed build check, so main always has build evidence.
# - On a published release: the build MUST be signed with the
#   project's release keystore (repository secrets below). If the
#   keystore secret is absent the release build fails loudly instead
#   of silently falling back to a debug key: an APK signed with a
#   fresh key cannot upgrade previous installs and must never be
#   published. Release signing secrets (all four required):
#     ANDROID_KEYSTORE_BASE64   base64 of the release keystore file
#     ANDROID_KEYSTORE_PASSWORD keystore password
#     ANDROID_KEY_ALIAS         key alias inside the keystore
#     ANDROID_KEY_PASSWORD      key password
#   Never commit a keystore to the repo.

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# Least privilege by default. The build job re-grants contents: write
# for itself only, because it uploads the APK to published releases.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run unit tests
        run: sh tests/run_tests.sh

  build:
    needs: test
    # Uploading release assets (gh release upload) needs write.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Install the exact SDK components build.sh needs directly with
      # the runner's bundled cmdline-tools. (The setup-android action's
      # inputs do not cover api level / build tools reliably.)
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-30" "build-tools;30.0.3"

      - name: Configure signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
              echo "ERROR: release build requires the signing secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD."
              echo "Refusing to publish a debug-signed or freshly-signed APK."
              exit 1
            fi
            mkdir -p out
            # --ignore-garbage tolerates stray characters (e.g. a zsh
            # prompt "%") copied into the secret by accident.
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d --ignore-garbage > out/release.keystore
            test -s out/release.keystore || { echo "Keystore restore produced an empty file"; exit 1; }
            {
              echo "RELEASE_KEYSTORE=$PWD/out/release.keystore"
              echo "RELEASE_KEYSTORE_PASS=$ANDROID_KEYSTORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "RELEASE_KEY_PASS=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Release build: signing with the project release keystore."
          else
            echo "ALLOW_DEBUG_SIGNING=1" >> "$GITHUB_ENV"
            echo "Non-release build: debug signing for build verification only."
          fi

      - name: Build APK
        run: |
          export ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK=$ANDROID_SDK"
          sh build.sh
          ls -lh out/tuyacontroller2mqtt.apk
          sha256sum out/tuyacontroller2mqtt.apk > out/tuyacontroller2mqtt.apk.sha256
          cat out/tuyacontroller2mqtt.apk.sha256

      - name: Upload APK to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            out/tuyacontroller2mqtt.apk out/tuyacontroller2mqtt.apk.sha256 --clobber
