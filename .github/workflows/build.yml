name: Build APK

# Builds the daemon APK with the manual build.sh (no Gradle) and, on a
# release, uploads it as a release asset so it can be downloaded from
# GitHub Releases without building locally.
#
# Signing note: build.sh signs with out/debug.keystore if present
# (storepass/keypass "android", alias "androiddebugkey"), and generates
# a fresh debug keystore otherwise. A fresh key on every CI run means a
# release APK cannot upgrade a previous release APK (Android refuses a
# signature change) — it must be uninstalled first.
# To get stable upgrades, generate one keystore locally once with
# those exact debug credentials, base64 it, and set it as the
# repository secret ANDROID_KEYSTORE_BASE64. With that secret set,
# every release is signed with the same key. Without it, the workflow
# still builds and uploads a debug-signed APK, fresh-install only.
# Never commit a keystore to the repo.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NOTE: do NOT use android-actions/setup-android@v3 here. Its v3
      # inputs are only cmdline-tools-version, accept-android-sdk-licenses,
      # log-accepted-android-sdk-licenses and packages — api-level and
      # build-tools are silently ignored, and its default packages are
      # "tools platform-tools", where the obsolete "tools" package no
      # longer exists, so sdkmanager fails with exit 1 before build.sh
      # ever runs (failed run 111520108921, Oct 30 2026). GitHub's
      # ubuntu runners already ship cmdline-tools/latest, so install
      # the exact components build.sh needs directly.
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-30" "build-tools;30.0.3"

      - name: Restore signing keystore (if configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            mkdir -p out
            # --ignore-garbage: GNU base64 is strict and fails the whole
            # step on a single stray character. A trailing "%" is easy
            # to copy by accident from a zsh prompt (zsh prints % when
            # output has no trailing newline), and whitespace/newlines
            # are harmless — ignore them instead of failing the build.
            # This was the run 111523611215 failure: "base64: invalid input".
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d --ignore-garbage > out/debug.keystore
            test -s out/debug.keystore || { echo "Keystore restore produced an empty file"; exit 1; }
            echo "Using secret keystore for signing."
          else
            echo "No keystore secret set; build.sh will generate a debug keystore (fresh-install APK only)."
          fi

      - name: Build APK
        env:
          ANDROID_SDK: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          sh build.sh
          ls -lh out/f5daemon.apk
          sha256sum out/f5daemon.apk > out/f5daemon.apk.sha256
          cat out/f5daemon.apk.sha256

      - name: Upload APK to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            out/f5daemon.apk out/f5daemon.apk.sha256 --clobber
