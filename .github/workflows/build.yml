name: Build APK

# Builds the daemon APK with the manual build.sh (no Gradle).
# - On every push to main and every pull request: run the unit tests
#   and a debug-signed build check, so main always has build evidence.
# - On a pushed version tag (v*): the release job builds the APK
#   signed with the project's release keystore (repository secrets
#   below) and creates the GitHub release itself, attaching the APK
#   and its SHA-256 checksum. The tag is the single source of truth
#   for releasing: a release exists only if the signed build passed,
#   and the tag must match versionName in app/build.gradle or the
#   release job fails. If a keystore secret is absent the release
#   build fails loudly instead of silently falling back to a debug
#   key: an APK signed with a fresh key cannot upgrade previous
#   installs and must never be published. Release signing secrets
#   (all four required):
#     ANDROID_KEYSTORE_BASE64   base64 of the release keystore file
#     ANDROID_KEYSTORE_PASSWORD keystore password
#     ANDROID_KEY_ALIAS         key alias inside the keystore
#     ANDROID_KEY_PASSWORD      key password
#   Never commit a keystore to the repo.
# - workflow_dispatch runs the test and build jobs only. The release
#   job is guarded to tag refs (github.ref_type == 'tag'), so a
#   manual run started from a branch can never create a release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default. The release job re-grants
# contents: write for itself only, because it creates the GitHub
# release and uploads the APK and checksum to it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Run unit tests
        run: sh tests/run_tests.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Install the exact SDK components build.sh needs directly with
      # the runner's bundled cmdline-tools. (The setup-android action's
      # inputs do not cover api level / build tools reliably.)
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-30" "build-tools;30.0.3"

      - name: Configure signing (CI builds, debug only)
        run: |
          echo "ALLOW_DEBUG_SIGNING=1" >> "$GITHUB_ENV"
          echo "CI build: debug signing for build verification only."
          echo "Release signing happens in the release job on version tags."

      - name: Build APK
        run: |
          export ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK=$ANDROID_SDK"
          sh build.sh
          ls -lh out/tuyacontroller2mqtt.apk
          sha256sum out/tuyacontroller2mqtt.apk > out/tuyacontroller2mqtt.apk.sha256
          cat out/tuyacontroller2mqtt.apk.sha256

  release:
    needs: test
    # Tag refs only. A workflow_dispatch run started from a branch
    # has github.ref_type == 'branch' and skips this job entirely.
    if: github.ref_type == 'tag'
    # Creating the release and uploading assets needs write.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Same SDK install as the build job.
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-30" "build-tools;30.0.3"

      # The tag is the release: it must agree with the version the
      # app itself reports, or the release would mislabel the APK.
      - name: Check tag matches versionName
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GRADLE_VERSION="$(grep -o 'versionName "[^"]*"' app/build.gradle | head -n 1 | cut -d '"' -f 2)"
          echo "Tag: $GITHUB_REF_NAME (version $TAG_VERSION); app/build.gradle versionName: $GRADLE_VERSION"
          if [ -z "$GRADLE_VERSION" ] || [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "ERROR: tag $GITHUB_REF_NAME does not match versionName '$GRADLE_VERSION' in app/build.gradle."
            echo "Bump versionName and versionCode in app/build.gradle before tagging a release."
            exit 1
          fi

      - name: Configure signing (release keystore required)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "ERROR: release build requires the signing secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD."
            echo "Refusing to publish a debug-signed or freshly-signed APK."
            exit 1
          fi
          mkdir -p out
          # --ignore-garbage tolerates stray characters (e.g. a zsh
          # prompt "%") copied into the secret by accident.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d --ignore-garbage > out/release.keystore
          test -s out/release.keystore || { echo "Keystore restore produced an empty file"; exit 1; }
          {
            echo "RELEASE_KEYSTORE=$PWD/out/release.keystore"
            echo "RELEASE_KEYSTORE_PASS=$ANDROID_KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "RELEASE_KEY_PASS=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Release build: signing with the project release keystore."

      - name: Build APK
        run: |
          export ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK=$ANDROID_SDK"
          sh build.sh
          ls -lh out/tuyacontroller2mqtt.apk
          sha256sum out/tuyacontroller2mqtt.apk > out/tuyacontroller2mqtt.apk.sha256
          cat out/tuyacontroller2mqtt.apk.sha256

      # Release notes come from the matching CHANGELOG.md section
      # (## [<version>] in Keep-a-Changelog form) when one exists;
      # the create step falls back to GitHub-generated notes.
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## / {
              if (capture) exit
              line = $0
              sub(/^## /, "", line)
              sub(/^\[/, "", line)
              tok = line
              sub(/[\] :].*/, "", tok)
              if (tok == ver) capture = 1
              next
            }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if grep -q '[^[:space:]]' release-notes.md; then
            echo "Release notes taken from CHANGELOG.md section for $VERSION:"
            cat release-notes.md
          else
            echo "No CHANGELOG.md section for $VERSION; the release will use generated notes."
            rm -f release-notes.md
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; uploading assets with --clobber instead."
            gh release upload "$GITHUB_REF_NAME" \
              out/tuyacontroller2mqtt.apk out/tuyacontroller2mqtt.apk.sha256 --clobber
          elif [ -f release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" \
              out/tuyacontroller2mqtt.apk out/tuyacontroller2mqtt.apk.sha256 \
              --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              out/tuyacontroller2mqtt.apk out/tuyacontroller2mqtt.apk.sha256 \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
