name: Gitleaks

# Scans the full git history for secrets on every push to main and
# every pull request. Uses the pinned upstream binary (checksum
# verified) rather than the action, so no license key is involved.
# The playbook asks for a dedicated scanner run for the record; this
# makes it continuous.
# Pin note: v8.30.1 is the latest upstream gitleaks release (checked
# 2026-11-15); when bumping, update the version and checksum together.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      - name: Scan full history
        run: /tmp/gitleaks git --redact .
